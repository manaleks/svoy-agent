name: Приложение на Windows
# Приложение «Свой агент» на настоящем Windows: сборка на месте, тесты,
# установка, запуск и снимок экрана. Код — черновик релиза proba-kod.
on:
  workflow_dispatch:
    inputs:
      exe:
        description: "какой exe ставить: sobrat (собрать здесь) или reliz (из последнего выпуска)"
        default: sobrat
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Код из черновика
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download proba-kod -R "$GITHUB_REPOSITORY" -p kod.tar.gz -D "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/kod.tar.gz"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Тесты приложения на Windows
        working-directory: dvizhok/prilozhenie
        run: |
          npm ci --no-audit --no-fund
          npm test
      - name: Сборка exe на Windows
        if: inputs.exe == 'sobrat'
        working-directory: dvizhok/prilozhenie
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Взять exe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/exe"
          if [ "${{ inputs.exe }}" = reliz ]; then
            gh release download -R "$GITHUB_REPOSITORY" -p svoy-agent-windows-x64.exe -D "$RUNNER_TEMP/exe"
          else
            cp dvizhok/prilozhenie/dist/svoy-agent-windows-x64.exe "$RUNNER_TEMP/exe/"
          fi
          ls -la "$RUNNER_TEMP/exe"
      - name: Установка, запуск, снимок
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $env:RUNNER_TEMP "exe\svoy-agent-windows-x64.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "/S" -PassThru -Wait
          "NSIS exit code " + $p.ExitCode
          Get-ChildItem -Path "$env:LOCALAPPDATA\Programs" -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 30 | ForEach-Object { $_.FullName }
          $app = Get-ChildItem -Path "$env:LOCALAPPDATA\Programs" -Recurse -Filter *.exe -ErrorAction SilentlyContinue | Where-Object { $_.Name -notmatch "^Uninstall" } | Select-Object -First 1
          if (-not $app) { throw "NET EXE PRILOZHENIYA POSLE USTANOVKI" }
          "app: " + $app.FullName
          $zapusk = Start-Process -FilePath $app.FullName -PassThru
          Start-Sleep -Seconds 20
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $ekran = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $ekran.Width, $ekran.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($ekran.Location, [System.Drawing.Point]::Empty, $ekran.Size)
          $bmp.Save((Join-Path $env:RUNNER_TEMP "snimok.png"))
          $zhiv = Get-Process -Id $zapusk.Id -ErrorAction SilentlyContinue
          if (-not $zhiv) { throw ("PRILOZHENIE ZAKRYLOS, kod " + $zapusk.ExitCode) }
          "OK: prilozhenie zhivo cherez 20 s"
      - name: Журнал Windows о падениях
        if: always()
        shell: powershell
        run: |
          Get-WinEvent -FilterHashtable @{LogName='Application'; Level=1,2; StartTime=(Get-Date).AddMinutes(-30)} -ErrorAction SilentlyContinue | Select-Object -First 10 | ForEach-Object { "----"; $_.TimeCreated; $_.ProviderName; $_.Message }
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snimok
          path: ${{ runner.temp }}/snimok.png
          if-no-files-found: ignore
