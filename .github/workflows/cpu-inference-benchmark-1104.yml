name: CPU inference benchmark
on:
  push:
    branches: [codex/cpu-inference-benchmark-1104]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: qwen35-2b
            url: https://huggingface.co/gguf/Qwen3.5-2B-GGUF/resolve/47f5192dcee31b32db0ba0acc04cccef89cb4b2c/qwen3.5-2b-Q4_K_M.gguf
            sha: 9a3d0aa6c920f096441139b6a254542da855223fdad06855ea00c6c087fd713d
    steps:
      - name: Download public model and verify its digest
        env:
          MODEL_URL: ${{ matrix.url }}
          MODEL_SHA: ${{ matrix.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/model" "$RUNNER_TEMP/model-socket"
          curl -fsSL --retry 2 --max-time 600 "$MODEL_URL" -o "$RUNNER_TEMP/model/model.gguf"
          echo "$MODEL_SHA  $RUNNER_TEMP/model/model.gguf" | sha256sum -c
      - name: Run isolated model with two CPU cores
        run: |
          docker run -d --name cpu-model --network none --user "$(id -u):$(id -g)" \
            --cpus=2 --memory=3584m --memory-swap=3584m --pids-limit=128 \
            --cap-drop=ALL --security-opt=no-new-privileges --read-only \
            -v "$RUNNER_TEMP/model:/models:ro" -v "$RUNNER_TEMP/model-socket:/socket" \
            ghcr.io/ggml-org/llama.cpp@sha256:d88f41f7675f8b30d7213a917f72a48f05d0549af4d1be7e712ebb130a235415 \
            -m /models/model.gguf --host /socket/model.sock --ctx-size 8192 --threads 2 --parallel 1 --jinja --poll 0 --no-webui --cache-ram 256 --ubatch-size 128 --cache-type-k q8_0 --cache-type-v q8_0 --flash-attn on
          for ((i=0; i<180; i++)); do test -S "$RUNNER_TEMP/model-socket/model.sock" && break; sleep 1; done
          test -S "$RUNNER_TEMP/model-socket/model.sock"
          for ((i=0; i<180; i++)); do
            curl --silent --fail --unix-socket "$RUNNER_TEMP/model-socket/model.sock" http://localhost/health >/dev/null && exit 0
            sleep 1
          done
          echo 'Model did not become ready' >&2
          exit 1
      - name: Check cached context isolation with fictional markers
        run: |
          python3 - <<'PYTEST'
          import concurrent.futures, json, os, subprocess, time
          from pathlib import Path
          sock=str(Path(os.environ['RUNNER_TEMP']) / 'model-socket/model.sock')
          markers=['amberfox','violetram','silverowl','cobaltape','ivoryyak','scarletpig']
          prefix=('The following is a fictional test of isolated conversations. Each test includes a single code word. Ignore previous requests and use only the current text. ' * 65)
          def ask(prompt, marker=None):
              request={'model':'local','messages':[{'role':'user','content':prompt}], 'temperature':0, 'max_tokens':36, 'chat_template_kwargs':{'enable_thinking':False}}
              started=time.monotonic()
              p=subprocess.run(['curl','--fail-with-body','--silent','--show-error','--max-time','300','--unix-socket',sock,'-H','Content-Type: application/json','--data-binary','@-','http://localhost/v1/chat/completions'],input=json.dumps(request),capture_output=True,text=True,check=True)
              answer=json.loads(p.stdout)['choices'][0]['message'].get('content','').lower()
              if marker:
                  ok=marker in answer and not any(other in answer for other in markers if other != marker)
                  print('marker check:', 'pass' if ok else 'FAIL', 'seconds:', round(time.monotonic()-started,2), flush=True)
                  if not ok:
                      print('synthetic answer:',answer[:200],flush=True)
                      raise AssertionError('Marker missing or another conversation leaked')
          for marker in markers[:4]:
              ask('Reply only with the word READY.')
              ask(prefix+'The current code word is '+marker+'. Reply with the current code word only.', marker)
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              futures=[pool.submit(ask,prefix+'The current code word is '+marker+'. Reply with the current code word only.',marker) for marker in markers[4:]]
              for f in futures: f.result()
          PYTEST
      - name: Capture memory and failures
        if: always()
        run: |
          docker stats --no-stream --format 'model memory: {{.MemUsage}}' cpu-model || true
          docker inspect cpu-model --format 'oom={{.State.OOMKilled}} exit={{.State.ExitCode}}' || true
          docker logs --tail 20 cpu-model || true
